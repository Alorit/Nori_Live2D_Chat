# ============================================================
# Nori AI 桌面宠物 配置文件
# 所有路径都可以写成相对项目根目录的相对路径
# ============================================================

llm:
  # LLM API Key：本地由 data/settings_overrides.json 或环境变量 DEEPSEEK_API_KEY 提供；
  # config.yaml 不保存真实 Key，避免分发泄露
  api_key: ""
  # OpenAI 兼容 Base URL：
  # - DeepSeek: https://api.deepseek.com
  # - OpenAI:   https://api.openai.com/v1
  # - Ollama:   http://127.0.0.1:11434/v1
  # - 其它本地/网关: 自定义地址
  base_url: "https://api.deepseek.com"
  # 模型名：当前端点（api.deepseek.com）实际提供 deepseek-flash / deepseek-v4-pro；
  # 旧的 deepseek-v4-flash 已下线，请求会直接 404「model not found」
  model: "deepseek-flash"
  temperature: 1.0
  max_tokens: 300
  # 工作记忆窗口：给 LLM 看最近多少条消息
  working_memory_size: 30
  # LLM 上下文压缩（成熟做法：保留最近窗口原文，更早对话压缩成摘要）
  context_compression:
    mode: "auto"          # off = 不压缩；on = 超过窗口即压缩；auto = 按长度智能压缩
    window_size: 20       # 保留最近多少条消息原文
    max_chars: 300        # 压缩摘要最大字符数

search:
  # 百度智能云 AI 搜索（每天免费额度，未开通按量计费时自动走免费额度）
  enabled: true
  provider: "baidu"
  # 本地 Key 由 data/settings_overrides.json 提供；config.yaml 不保存真实 Key
  api_key: ""
  top_k: 4
  timeout: 120

# 视觉能力已独立为 MCP 服务器（vision_mcp/）：
# - 不在此处保存任何视觉 API Key，避免分发泄露
# - 请先启动 vision_mcp/server.py
# - 然后在 GUI 设置 → MCP/Skills → 导入 MCP JSON，选择 vision_mcp/nori-vision.mcp.json
# - 视觉服务器配置：vision_mcp/config.json 或环境变量 VOLC_ARK_API_KEY

persona:
  # 多人格：每个 persona/*.md 是一个人设，可在 GUI“人格”页新建/切换/导入/删除。
  # 当前生效人格记录在 data/persona_active.json。
  persona_dir: "persona"
  active_persona: "nori"

  # 允许使用的表情标签（LLM 只会从这些里选）
  expressions: ["开心", "难过", "惊讶", "害羞", "生气", "认真", "困惑", "得意", "无奈"]
  # 允许使用的动作标签
  motions: ["点头", "摇头", "发呆", "兴奋", "困扰", "晕眩", "生气", "困了"]

  # 表情/动作标签的技术映射（不再作为 System Prompt 注入；人格完全由 .md 决定）
  # 逻辑表情名 -> Live2D 模型真实表情名 的映射（按你的模型实际 expression 名填）
  # arg-nori 的真实表情共 16 个：00_Default 01_KiraKira 02_Dizzy 03_Angry 04_Shy
  #   05_Dark 06_Speechless 07_Smile 08_Tears 09_Troubled 10_Doubt 11_Disgust
  #   12_Serious 13_Happy Sleep 14_Surprised
  # 解析器会忽略 “00_” 这类数字前缀且大小写不敏感，所以这里写 smile / happy 即可。
  # 2026-10-26 修：旧值「爱心眼 / 圈圈眼 / 黑化 / 戴帽子」是上一个 nori 模型的配件表情，
  #   arg-nori 里并不存在 → heart 的自主表情 7/7 全部静默失败（set_expression 返回 ok:false）。
  emotion_map:
    开心: "happy"
    难过: "troubled"
    惊讶: "surprised"
    害羞: "shy"
    生气: "angry"
    认真: "serious"
    困惑: "doubt"
    得意: "smile"
    无奈: "speechless"

  # 逻辑动作名 -> Live2D 模型真实动作名 的映射
  # arg-nori 的动作组：Idle(01_Idle_Loop / sleep_Loop)、Reactions(02_Nod / 03_ShakeHead /
  #   04_WakuWaku / 05_Angry / 06_Troubled / 07_Dizzy)、Effects(08_Glitch_Loop)、
  #   Poses(Idle_pose_Loop)、Background(back_Loop)
  # 2026-10-26 修：wave / bow 在该模型里不存在（旧注释「没有动作文件」是上一个模型的过时信息），
  #   改用 wakuwaku / dizzy / sleep 这些真实存在的动作。
  motion_map:
    点头: "nod"
    摇头: "shake"
    发呆: "idle"
    兴奋: "wakuwaku"
    困扰: "troubled"
    晕眩: "dizzy"
    生气: "angry"
    困了: "sleep"

live2d:
  # 是否启用 Live2D（false 则只显示聊天窗口）
  enabled: true
  # 控制方式：native = 使用 Nori-Desktop-Pet 原生 Avalonia/OpenGL 桌宠（当前模式）
  # 旧的 mcp / model_path 方案已移除，仅保留 native 控制方式
  controller: "native"
  # 原生 Live2D 应用可执行文件路径（项目内已内置自包含预编译宿主，无需额外 .NET 运行时）
  native_app_path: "vendor/nori_desktop_pet/Nori.Desktop.exe"
  # 使用 .exe 时无需 dotnet；保留字段以便将来切换 .dll 模式
  native_dotnet_path: ""
  # 整体缩放倍率：1.0 = 基准大小；2.0 = 窗口和模型都放大一倍。
  # 操作面板滑条范围 0.5x ~ 2.0x，原生侧限制 0.1x ~ 2.0x
  scale: 1.0
  # 是否在模型未加载成功时自动退回内置简单宠物
  fallback_on_error: true
  # 窗口背景透明（QWebEngineView 在部分 Windows 显卡上透明可能失败，失败会自动改回纯色）
  transparent: true
  # 若透明失败使用的背景色 (R,G,B)
  bg_color: [245, 245, 245]
  # 语音气泡显示时间：最短/最长秒数（按文本长度自动调整）
  bubble_min_sec: 3
  bubble_max_sec: 12

tts:
  # 只保留 Nori 音色：GPT-SoVITS 使用 Nori 语音微调权重。
  # 权重位于 data/voices/nori/，由 GPT_SoVITS/configs/tts_infer.yaml 加载；
  # GUI 启动时自动拉起 API，冷启动期间消息排队，API 就绪后自动朗读。
  # 旧的 sherpa / piper / edge 后端已移除（备份见 D:/Nori_Backup/）；
  # GPT-SoVITS 不可用时用 system（Windows SAPI5）兜底。
  backend: "gpt_sovits"
  order: ["gpt_sovits", "system"]
  # 首选后端长时间不就绪（约 90 秒）时自动回落到 order 里的其它后端（即 system）；
  # 设为 false 则只等 GPT-SoVITS，不启用系统语音。
  allow_system_fallback: true
  # 全局语速（GUI 语速滑块写入此处；各后端可自行覆盖）
  speed: 1.0

  # GPT-SoVITS（Nori 微调模型，中英日都行，GUI 会静默启动并显示日志）
  gpt_sovits:
    api_url: "http://127.0.0.1:9880"
    # 合成文本语言：auto / zh / en / ja ...
    text_lang: "auto"
    # 参考音频（音色克隆参考）：Nori 干净单句样本
    ref_audio_path: "D:\\Nori_Live2D_Chat\\data\\inori_voice\\nori_ref.wav"
    # 参考音频对应的文字（已从游戏聊天记录确认）
    prompt_text: "Nori 是最擅长玩游戏、最喜欢你陪伴的小人偶 AI！"
    prompt_lang: "zh"
    # GUI 启动时是否自动（无窗口）拉起 GPT-SoVITS API
    auto_start: true
    # GPT-SoVITS 安装目录（内含 runtime/pythonw.exe 与 api_v2.py）
    runtime_dir: "D:/GPT-SoVITS-v2pro-20250604-nvidia50"

memory:
  # 检索后端：auto = 优先向量（如果已安装 sentence-transformers），否则 BM25
  # 可选：bm25（纯本地，无需下载模型）、vector（需要 pip install sentence-transformers）
  backend: "auto"
  # 向量模型（只有 vector 后端使用），中文推荐 bge-small-zh-v1.5，英文/多语可换 bge-m3
  vector_model: "BAAI/bge-small-zh-v1.5"
  # 每轮注入系统提示的长期记忆条数
  top_k: 8
  # 人格 .md 里没有写 {{memory}}/{{rules}}/{{summary}}/{{time}} 占位符时，
  # 是否自动把这些动态上下文附加到 System Prompt 末尾；
  # 设为 false 就退回“只用 .md 原文”，记忆/规则/时间都不会进提示词
  inject_context: true
  # 每隔多少轮用户对话触发一次后台反思整合（提取事实/规则/摘要）
  consolidate_interval: 10
  # 记忆库最大条数，超过后会遗忘低重要度的旧记忆
  max_memories: 5000
  # 重要性阈值：低于此值的纯闲聊不进入长期记忆
  importance_threshold: 0.15
  # 长期记忆保存的交换（一轮用户+AI）最小字数
  min_exchange_chars: 8
  # 定时记忆回顾：自动做 LLM 总结，并把高度相似的记忆合并为一条
  auto_review_enabled: true
  auto_review_minutes: 30
  similarity_threshold: 0.85

gui:
  # 启动时是否显示聊天窗口
  show_chat_on_start: true
  # 是否置顶宠物窗口（也可在面板里实时切换）
  pet_always_on_top: true
  # 界面字体大小（非聊天气泡部分；可在 设置→基础设置 里调整）
  font_size: 13
  # 聊天气泡字体大小（与界面字体分开设置）
  chat_font_size: 15
  # 用户昵称（聊天记录中显示；留空 = 首次启动向导询问，之后可在 设置→基础设置 修改）
  user_name: ""
  # 智能体显示名兜底（各人格可在 设置→基础设置 分别修改，Nori 为默认）
  agent_name: "Nori"
  # 自定义头像（空 = 默认 emoji；可在 设置→基础设置 里选择图片）
  user_avatar: ""
  # 语音包导出目录（空 = 默认下载目录；可在 设置→基础设置 修改）
  voice_export_dir: ""
  # 聊天窗口初始大小（面板含 聊天/记忆/人格/控制台/设置 页签）
  chat_width: 760
  chat_height: 820
  # 启动问候（不需要 LLM，本地直接播放）
  greeting: "你好呀，我是 Nori！先填好 API Key 我们就可以聊天啦。"

heart:
  # “心脏”：独立进程，定时检查 AI 自己设定的下次醒来时间并唤醒一轮私人思考
  enabled: true
  # 关闭 GUI 时是否同时停止 heart（false = heart 继续在后台自主运行）
  stop_with_gui: false
  # 轮询间隔（秒）。实际心跳由 autonomy.tick_sec 决定，这里只作为旧配置兜底
  poll_interval_sec: 20
  # 初始/兜底的醒来间隔（分钟）
  default_wake_minutes: 15
  # AI 可设置的最短/最长醒来间隔（分钟）
  min_wake_minutes: 2
  max_wake_minutes: 120
  # 主人最近发言多久内保持安静，避免抢话（秒）
  chat_quiet_sec: 90
  # 允许 heart 自主说话（Live2D + TTS）
  allow_speak: true
  # 状态文件
  state_file: "data/heart.json"

autonomy:
  # ===== 秒级反射层（agent/pet_director.py）=====
  # 不花 token：微动作、作息、主人是否在场，全部由本地规则决定。
  # LLM 只在“醒来”时给一份带时间轴的剧本，导演负责按时间执行。
  enabled: true
  # 心跳间隔（秒）。1 秒足够，CPU 占用可以忽略
  tick_sec: 1
  # 是否启用微动作（没人说话时的小动作 / 表情）
  micro_motion: true
  # 微动作间隔按指数分布抖动，不是固定节拍（固定节拍看起来很机械）
  # 0.0055 ≈ 平均 3 分钟一次；0.0012 ≈ 夜平均 14 分钟一次
  micro_lambda_day: 0.0055
  micro_lambda_night: 0.0012
  # 深夜时段 [start, end)：自动切到 sleep_Loop，且不主动说话
  quiet_hours: [1, 7]
  # 主动说话预算：每小时最多几次（0 = 完全不主动说话）
  speak_budget_per_hour: 3
  # 两句自主台词之间至少隔多少秒（避免剧本里连排几句像卡带）
  speak_cooldown_sec: 45

  # ===== 主人状态感知（agent/presence.py）=====
  # 纯本地 Win32（GetLastInputInfo / GetForegroundWindow），不联网、不截图
  presence: true
  # 无操作超过这个秒数算“主人不在”，她会去睡；主人回来时会有反应
  away_sec: 300
  # 是否把前台窗口标题喂给 LLM（默认 false：只看进程名，避免网页标题里的隐私进入提示词）
  use_window_title: false

  # ===== 心智层 =====
  # 内心 OS / 自主说话是否显示在聊天窗（heart 写 data/heart_events.jsonl，GUI 轮询）
  inner_os: true
  # 人格摘要：把 8.8k 字符的人格 md 压成约 400 字给自主回合用（省约 70% 输入 token）
  # 摘要按人格内容哈希缓存，人格改了才重新生成（一次约 9k 输入）
  persona_digest: true
  # 情绪基线：valence 效价 -1~1，arousal 唤醒度 0~1，energy 精力 0~1
  emotion_baseline:
    valence: 0.1
    arousal: 0.45
    energy: 0.6

advanced:
  # 是否在启动时自动下载缺失的 TTS 模型（需要能访问 GitHub/HuggingFace）
  auto_download_tts: false
  # 日志文件（GUI“控制台”页会合并显示 data/logs/*.log）
  log_file: "data/logs/agent.log"
